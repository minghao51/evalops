# generated by 'make ci-adapters' from src/evalops/ci_adapters.py — edit the template, not this file
# Copy to .gitlab-ci.yml. Set EVALOPS_ENV + backend credentials as CI/CD variables.
image: python:3.11
variables: { EVALOPS_ENV: "local", PIP_EXTRAS: "" }
before_script:
  - pip install -e ".[${PIP_EXTRAS}]" -r requirements.txt

evalops:pr:
  # pr stage, fired by merge_request_event.
  # EVALOPS_PR routes the state commit to the bot branch `evalops/state/pr-<N>` (WP2.2), so a
  # pull request from a fork publishes its locks without pushing to the source branch; the
  # pipeline picks the bot branch itself, so no fork conditional is rendered here.
  rules: [{ if: '$CI_PIPELINE_SOURCE == "merge_request_event"' }]
  variables:
    EVALOPS_PR: "$CI_MERGE_REQUEST_IID"
    EVALOPS_BRANCH: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
  script:
    - export EVALOPS_ALLOW_FROZEN_CHANGE=$([[ "$CI_MERGE_REQUEST_LABELS" == *approve-dataset-change* ]] && echo true || echo false)
    - git remote set-url origin "https://oauth2:${EVALOPS_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git checkout -B "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - bash ci/pipeline.sh pr
  artifacts: { when: always, paths: [.evalops/out/] }

evalops:main:
  # main stage, fired by push.
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"' }]
  resource_group: evalops-main
  variables:
    EVALOPS_BRANCH: "$CI_DEFAULT_BRANCH"
  script:
    - bash ci/pipeline.sh main
  artifacts: { when: always, paths: [.evalops/out/] }

evalops:release:
  # release stage, fired by manual web trigger.
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH', when: manual }]
  environment: { name: production }  # protect for approvals; set EVIDENCE_GROUP when triggering
  variables:
    EVALOPS_BRANCH: "$CI_DEFAULT_BRANCH"
  script:
    - bash ci/pipeline.sh release

evalops:nightly:
  # nightly stage, fired by schedule.
  rules: [{ if: '$CI_PIPELINE_SOURCE == "schedule"' }]
  script:
    - bash ci/pipeline.sh nightly
  artifacts: { when: always, paths: [.evalops/out/] }
