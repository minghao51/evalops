# generated by 'make ci-adapters' from src/evalops/ci_adapters.py — edit the template, not this file
# Copy to azure-pipelines.yml. For release approvals, move the release step into a deployment
# job targeting an Azure DevOps environment named "production" with required approvers.
trigger: { branches: { include: [main] } }
pr: { branches: { include: ["*"] } }
schedules:
  - cron: "0 3 * * *"
    branches: { include: [main] }
    always: true
parameters:
  - { name: evidenceGroup, type: string, default: "" }

pool: { vmImage: ubuntu-latest }
variables: { EVALOPS_ENV: local, PIP_EXTRAS: "" }

steps:
  - checkout: self
    persistCredentials: true
    fetchDepth: 0
  - task: UsePythonVersion@0
    inputs: { versionSpec: "3.11" }
  - script: pip install -e ".[$(PIP_EXTRAS)]" -r requirements.txt
  # pr stage, fired by PullRequest.
  # EVALOPS_PR routes the state commit to the bot branch `evalops/state/pr-<N>` (WP2.2), so a
  # pull request from a fork publishes its locks without pushing to the source branch; the
  # pipeline picks the bot branch itself, so no fork conditional is rendered here.
  - script: |
      BR="${SYSTEM_PULLREQUEST_SOURCEBRANCH#refs/heads/}"
      git checkout -B "$BR"
      EVALOPS_PR=$(System.PullRequest.PullRequestId) EVALOPS_BRANCH="$BR" bash ci/pipeline.sh pr
    condition: eq(variables['Build.Reason'], 'PullRequest')
  # main stage, fired by IndividualCI (push).
  - script: EVALOPS_BRANCH=main bash ci/pipeline.sh main
    condition: and(eq(variables['Build.Reason'], 'IndividualCI'), eq(variables['Build.SourceBranchName'], 'main'))
  # release stage, fired by Manual build.
  - script: EVALOPS_BRANCH=main EVIDENCE_GROUP="${{ parameters.evidenceGroup }}" bash ci/pipeline.sh release
    condition: and(eq(variables['Build.Reason'], 'Manual'), ne('${{ parameters.evidenceGroup }}', ''))
  # nightly stage, fired by Schedule.
  - script: bash ci/pipeline.sh nightly
    condition: eq(variables['Build.Reason'], 'Schedule')
  - publish: .evalops/out
    artifact: evalops
    condition: always()
