# generated by 'make ci-adapters' from src/evalops/ci_adapters.py — edit the template, not this file
# Copy to .github/workflows/evalops.yml. Backend = repo variable EVALOPS_ENV (mlflow, databricks,
# langfuse, langsmith, logfire, local...). Only the secrets your backend needs must be set.
name: evalops
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
    inputs:
      evidence_group: { description: "main-stage group id to promote", required: true }

permissions: { contents: write, pull-requests: write, id-token: write }

env:
  EVALOPS_ENV: ${{ vars.EVALOPS_ENV || 'local' }}
  EVALOPS_LEDGER_URL: ${{ secrets.EVALOPS_LEDGER_URL }}  # sql ledger (e.g. Postgres) when used
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_SP_TOKEN }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
  LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
  LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
  LOGFIRE_READ_TOKEN: ${{ secrets.LOGFIRE_READ_TOKEN }}
  PIP_EXTRAS: ${{ vars.EVALOPS_EXTRAS || '' }}  # e.g. "mlflow" or "langfuse,sql"

jobs:
  # pr stage, fired by pull_request.
  # EVALOPS_PR routes the state commit to the bot branch `evalops/state/pr-<N>` (WP2.2), so a
  # pull request from a fork publishes its locks without pushing to the source branch; the
  # pipeline picks the bot branch itself, so no fork conditional is rendered here.
  # The pr job checks out `refs/pull/<N>/head` from the base repository (a fork-only branch does
  # not exist in it), so `origin` stays the base repository and the bot-branch push lands there.
  # GitHub issues a read-only GITHUB_TOKEN to pull requests from forks unless the repository setting
  # 'Send write tokens to workflows from pull requests' (Settings > Actions > General > Workflow
  # permissions) is enabled; without that setting -- or an authorized push token that can write the
  # bot branch -- the bot-branch push cannot succeed.
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency: { group: "evalops-pr-${{ github.event.pull_request.number }}", cancel-in-progress: true }
    env:
      EVALOPS_PR: ${{ github.event.pull_request.number }}
      EVALOPS_BRANCH: ${{ github.head_ref }}
      EVALOPS_ALLOW_FROZEN_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'approve-dataset-change') }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "refs/pull/${{ github.event.pull_request.number }}/head", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[${PIP_EXTRAS}]" -r requirements.txt
      - run: bash ci/pipeline.sh pr
      - if: always() && hashFiles('.evalops/out/gate_report.md') != ''
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file .evalops/out/gate_report.md
        env: { GH_TOKEN: "${{ github.token }}" }

  # main stage, fired by push.
  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: { group: evalops-main }
    env:
      EVALOPS_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[${PIP_EXTRAS}]" -r requirements.txt
      - run: bash ci/pipeline.sh main
      - if: always()
        run: cat .evalops/out/gate_report.md >> "$GITHUB_STEP_SUMMARY" || true

  # release stage, fired by workflow_dispatch.
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production  # configure required reviewers here
    env:
      EVALOPS_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[${PIP_EXTRAS}]" -r requirements.txt
      - run: bash ci/pipeline.sh release
        env: { EVIDENCE_GROUP: "${{ inputs.evidence_group }}" }

  # nightly stage, fired by schedule.
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[${PIP_EXTRAS}]" -r requirements.txt
      - run: bash ci/pipeline.sh nightly
      - if: always()
        run: cat .evalops/out/drift_report.md >> "$GITHUB_STEP_SUMMARY" || true
