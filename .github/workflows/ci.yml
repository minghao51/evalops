name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Dev tooling only: vendor extras (mlflow, langfuse, ...) are never installed in CI.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: make check (lint + typecheck + tests)
        run: make check

      # Guards the pytest-free fallback used by the v0.3 baseline.
      - name: No-pytest runner
        run: python tests/run_without_pytest.py
