[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalops"
version = "0.3.0"
description = "Backend-agnostic versioning, evaluation, gating and cost control for LLM apps (plugins for MLflow, Langfuse, LangSmith, Logfire, git, SQL)"
requires-python = ">=3.10"
# Core stays vendor-free, not dependency-free: pydantic backs the typed config (D4).
dependencies = ["pyyaml>=6", "pydantic>=2,<3"]

[project.optional-dependencies]
mlflow = ["mlflow>=3.2,<4"]
databricks = ["mlflow[databricks]>=3.2,<4"]
langfuse = ["langfuse>=3"]
langsmith = ["langsmith>=0.3", "langchain-core>=0.3"]
logfire = ["logfire>=3"]
sql = ["sqlalchemy>=2", "psycopg[binary]>=3"]  # only for non-SQLite ledgers (Postgres, MySQL, ...)
otel = ["opentelemetry-sdk>=1.27"]    # trace capture for OTel-instrumented frameworks
langgraph = ["langchain-core>=0.3"]   # native LangChain/LangGraph callback capture
# The evalops rubric judge fallback (WP3b.3): `judges.<name>.judge: litellm`. No preset and no
# plugin requires it -- the native judges are the default -- so it is installed by hand, never by
# a preset's extras, and an absent package is exit 6 with `pip install litellm`.
litellm = ["litellm>=1.40"]
# OpenInference instrumentors are installed per framework, e.g.
#   pip install openinference-instrumentation-crewai openinference-instrumentation-llama-index
dev = ["pytest>=8", "pytest-xdist>=3", "hypothesis>=6", "ruff>=0.9", "mypy>=1.10"]

[project.scripts]
evalops = "evalops.cli:main"

# Third-party plugins register like this in THEIR pyproject:
# [project.entry-points."evalops.plugins"]
# braintrust = "evalops_braintrust:BraintrustPlugin"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Tests: pytest config lives here so every entry point (CI, make, agents) agrees.
# `contract` tests need docker/credentials and are excluded from the offline suite.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = '-m "not contract"'
markers = [
    "contract: needs a live backend (docker-local or credentials); excluded from the offline suite",
    "slow: takes more than ~10s; run explicitly when iterating on the slow path",
]

# ---------------------------------------------------------------------------
# Lint: py310, 120 cols. The per-file ignores are pre-existing debt in files this
# WP may not edit (src/**); remove an entry as soon as its file is touched.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/evalops/__init__.py" = ["I001"]
"src/evalops/cli.py" = ["I001"]
"src/evalops/prompts.py" = ["B007"]
"src/evalops/ports.py" = ["B027", "UP035"]
"src/evalops/scoring.py" = ["UP035"]
"src/evalops/tools.py" = ["UP037"]
"src/evalops/plugins/langfuse.py" = ["E501"]
"src/evalops/plugins/langsmith.py" = ["E501", "SIM117"]
"src/evalops/plugins/mlflow.py" = ["I001"]
"src/evalops/plugins/sql.py" = ["E501", "I001"]
"src/evalops/scorers/__init__.py" = ["I001"]
"src/evalops/traces/capture.py" = ["SIM105", "UP037"]
"src/evalops/traces/instrument.py" = ["E501"]
# pre-existing debt outside this WP's editable paths (examples/, src/); drop when touched.
"examples/langgraph_hooks.py" = ["I001"]

# ---------------------------------------------------------------------------
# Types: non-strict on the legacy modules, strict for `evalops.config` and the new
# contract/stats surfaces. `evalops.contract` lands in WP0.4, `evalops.stats` in WP1.3;
# unmatched per-flag overrides are inert until then. `evalops.config` became strict in WP0.4b
# (the former `disable_error_code = ["assignment"]` escape hatch is gone).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/evalops"]
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["evalops.scoring"]
disable_error_code = ["attr-defined"]   # decorator attributes are attached dynamically

# Equivalent to `strict = true`, spelled out because mypy 2.x promotes an unmatched
# `strict = true` override to the default section, which would strict-check all of src/.
# `warn_unused_configs` and `warn_redundant_casts` are global-only flags in mypy 2.x and are
# therefore omitted here. The modules may not exist yet; unmatched per-flag overrides are inert.
[[tool.mypy.overrides]]
module = [
    "evalops.config",
    "evalops.config.*",
    "evalops.contract",
    "evalops.contract.*",
    "evalops.stats",
    "evalops.stats.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
